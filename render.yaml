databases:
  - name: myscape-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: myscape-web
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: myscape-db
          property: connectionString
      - key: PYTHON_VERSION
        # Pinned explicitly rather than trusting Render's default -- that
        # default has already jumped to a Python version (3.14) newer than
        # psycopg2-binary has working precompiled wheels for, which is what
        # broke the first deploy (ImportError: undefined symbol
        # _PyInterpreterState_Get -- a wheel built for the wrong Python ABI).
        value: "3.12.7"
