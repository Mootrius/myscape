databases:
  - name: myscape-db
    plan: 0.1c-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: myscape-web
    runtime: python
    plan: 1c-2g
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    # Disks only attach to a paid service (see the disk docs) -- this
    # service is on the 1c-2g plan now, which does support one, so
    # ICON_CACHE_DIR below (app/icon_cache.py's whole reason to exist --
    # see that module's own top-of-file comment) finally persists across
    # redeploys and spin-downs instead of silently pointing at ephemeral
    # container storage that looked identical to a real mounted disk.
    disk:
      name: icon-cache
      mountPath: /var/data/item-icons
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: myscape-db
          property: connectionString
      - key: ICON_CACHE_DIR
        # Points app/icon_cache.py's disk cache at the mount above --
        # see that module's own top-of-file comment. Without this (e.g.
        # in local dev), it falls back to a folder next to that file
        # instead, which is fine there but would be wiped on every
        # redeploy here.
        value: /var/data/item-icons
      - key: PYTHON_VERSION
        # Pinned explicitly rather than trusting Render's default -- that
        # default has already jumped to a Python version (3.14) newer than
        # psycopg2-binary has working precompiled wheels for, which is what
        # broke the first deploy (ImportError: undefined symbol
        # _PyInterpreterState_Get -- a wheel built for the wrong Python ABI).
        value: "3.12.7"
      - key: SESSION_SECRET_KEY
        # Signs website login session cookies. generateValue makes Render
        # create a random value once and keep it stable across deploys and
        # restarts -- if this changed on every restart, everyone's login
        # session would silently break every time the service restarts
        # (redeploys, or -- back when this was on the free plan -- a
        # spin-down from inactivity waking back up).
        generateValue: true
      - key: RESEND_API_KEY
        # Used by app/email_client.py to send password-reset emails via
        # Resend. sync: false means Render prompts for this in the
        # dashboard instead of storing a value here -- an API key doesn't
        # belong committed to the repo. Without it set, email_client.py
        # just logs the email instead of sending it (see that module's
        # own comment), which is fine for local dev but means password
        # reset silently won't deliver anything here until this is set.
        sync: false
      - key: EMAIL_FROM_ADDRESS
        # Optional -- app/email_client.py falls back to a sensible default
        # ("myscape <noreply@myscape.io>") if this isn't set. Only worth
        # setting explicitly once a sending domain is verified with Resend
        # for myscape.io; until then Resend will reject or hold mail from
        # an unverified domain regardless of what this says.
        sync: false
