databases:
  - name: myscape-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: myscape-web
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: myscape-db
          property: connectionString
